<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Fayee</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Georgia,serif;color:#493b34;background:linear-gradient(#82c7ef,#cceafb 58%,#f8ddb5);min-height:100vh}.scene{height:100vh;display:grid;place-items:center;position:relative}.sun{position:absolute;width:170px;height:170px;border-radius:50%;right:9%;top:7%;background:#ffe4a6;box-shadow:0 0 65px #ffe9b0}.cloud{position:absolute;width:180px;height:55px;border-radius:50px;background:#ffffffb8;filter:blur(.2px);animation:drift 35s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:80px;height:80px;left:25px;bottom:12px}.cloud:after{width:95px;height:95px;right:20px;bottom:3px}.c1{left:-220px;top:18%}.c2{left:-250px;top:68%;animation-duration:44s;animation-delay:-15s;transform:scale(.7);opacity:.55}.c3{left:-250px;top:40%;animation-duration:50s;animation-delay:-29s;transform:scale(.45);opacity:.4}@keyframes drift{to{left:115vw}}.card{z-index:2;width:min(880px,90vw);height:510px;border-radius:38px;text-align:center;padding:55px 25px;background:#ffffff45;border:1px solid #ffffffa8;backdrop-filter:blur(12px);box-shadow:0 25px 80px #41677d25;position:relative}.tiny{letter-spacing:4px;text-transform:uppercase;opacity:.62;font-size:14px;margin:0 0 8px}h1{font-weight:500;color:#fffaf2;font-size:clamp(38px,6vw,62px);margin:0 0 42px;text-shadow:0 3px 15px #42647838}.buttons{display:flex;justify-content:center;gap:28px;height:190px}.choice{border:0;width:215px;height:175px;border-radius:30px;font:25px Georgia;cursor:pointer;color:#49382d;box-shadow:0 12px 30px #3c505a25;transition:.25s}.choice:hover{transform:translateY(-7px) rotate(-1deg)}.choice:active{transform:scale(.96)}.choice:before{display:block;font-size:65px;margin-bottom:5px}.choice small{display:block;font-size:14px;opacity:.6;margin-top:5px}.pie{background:linear-gradient(145deg,#ffe7b9,#eeb16d)}.pie:before{content:'🥧'}.sky{background:linear-gradient(145deg,#e2f6ff,#8bcaf0)}.sky:before{content:'☁️'}.merge .choice{opacity:0;transform:scale(.2) rotate(180deg);pointer-events:none}.fayee{position:absolute;left:50%;top:52%;width:250px;height:105px;border:0;border-radius:999px;background:linear-gradient(135deg,#fff2d2,#bdeaff);color:#51443b;font:500 31px Georgia;letter-spacing:2px;cursor:pointer;opacity:0;transform:translate(-50%,-50%) scale(0);box-shadow:0 15px 40px #46647830}.show .fayee{animation:pop .75s cubic-bezier(.17,.89,.32,1.3) forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}.birthday{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#fff5dcf7,#7fc4edf5);opacity:0;visibility:hidden;transform:scale(1.08);transition:.8s}.birthday.on{opacity:1;visibility:visible;transform:scale(1)}.cake{font-size:70px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-9px)}}.birthday h2{font-size:clamp(55px,11vw,125px);line-height:.9;color:#fffdf7;font-weight:500;text-shadow:0 5px 22px #3e5d7045;margin:10px 0}.birthday p{font-size:clamp(18px,3vw,28px);line-height:1.45}.spark{position:fixed;z-index:20;pointer-events:none;font-size:23px;animation:float 3s ease-out forwards}@keyframes float{to{opacity:0;transform:translateY(-230px) rotate(180deg)}}@media(max-width:600px){.card{height:500px;padding-top:45px}.buttons{gap:12px}.choice{width:145px;height:155px;font-size:20px}.choice:before{font-size:55px}}
</style></head><body><div class="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><main class="card" id="card"><p class="tiny">a little something for you</p><h1>pick one ☁️</h1><div class="buttons"><button class="choice pie">PIE<small>sweet choice</small></button><button class="choice sky">SKY<small>cloudy choice</small></button></div><button class="fayee" id="fayee">FAYEE ✦</button></main><section class="birthday" id="birthday"><div><div class="cake">🎂</div><h2>HAPPY<br>BIRTHDAY!</h2><p>For Fayee ☁️🥧<br>hope your day is as sweet as pie<br>and as pretty as the sky.</p></div></section></div><script>const card=document.getElementById('card'),f=document.getElementById('fayee'),b=document.getElementById('birthday');function sparks(){let a=['✦','♡','☁','🥧','✧'];for(let i=0;i<20;i++){let s=document.createElement('span');s.className='spark';s.textContent=a[Math.random()*a.length|0];s.style.left=45+Math.random()*10+'%';s.style.top=45+Math.random()*15+'%';document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{if(card.classList.contains('show'))return;card.classList.add('merge');sparks();setTimeout(()=>card.classList.add('show'),300)});f.onclick=()=>{sparks();b.classList.add('on')};</script></body></html>
